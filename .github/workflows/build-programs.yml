name: Build Programs

on:
  workflow_call:
    inputs:
      git_ref:
        type: string
      rust:
        type: string
      solana:
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit hash, branch, or tag to build
        default: main
        required: true
        type: string
      rust:
        description: Rust version
        default: 1.70.0
        required: true
        type: string
      solana:
        description: Solana version
        default: 1.16.17
        required: true
        type: string

env:
  CACHE: true

jobs:
  build_programs:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Load environment variables
        id: env_vars
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"`
          # so a PR-editable key in `.github/.env` cannot inject arbitrary env
          # vars into subsequent steps.
          grep -E '^(CARGO_TERM_COLOR|RUST_VERSION|SOLANA_VERSION|SOLANA_VERIFY_VERSION|PROGRAMS)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              SOLANA_VERSION) printf 'solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ inputs.rust || steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ inputs.solana || steps.env_vars.outputs.solana_version }}
          cache: ${{ env.CACHE }}

      - name: Cache program dependencies
        if: env.CACHE == 'true'
        uses: metaplex-foundation/actions/cache-programs@v1

      - name: Install solana-verify
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Build mpl-hybrid (verified)
        uses: metaplex-foundation/actions/verified-build@v1
        with:
          library-name: mpl_hybrid
          package: mpl-hybrid-program
          solana-version: ${{ inputs.solana || steps.env_vars.outputs.solana_version }}
          output-dir: programs/.bin

      - name: Dump external program binaries
        run: ./configs/scripts/program/dump.sh ./programs/.bin
        shell: bash

      - name: Upload program builds
        uses: actions/upload-artifact@v4
        with:
          name: program-builds
          # First wildcard ensures exported paths are consistently under the programs folder.
          path: ./program*/.bin/*.so
          include-hidden-files: true
          if-no-files-found: error
