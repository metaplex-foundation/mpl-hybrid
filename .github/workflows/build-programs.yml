name: Build Programs

on:
  workflow_call:
    inputs:
      git_ref:
        type: string
      rust:
        type: string
      solana:
        type: string
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit hash, branch, or tag to build
        default: main
        required: true
        type: string
      rust:
        description: Rust version
        default: 1.70.0
        required: true
        type: string
      solana:
        description: Solana version
        default: 1.16.17
        required: true
        type: string

env:
  CACHE: true
  # Hard-coded and digest-pinned to keep the verified build reproducible and to
  # prevent a PR-controlled `.github/.env` from redirecting `solana-verify
  # build --base-image` at a malicious image. Update this digest in lockstep
  # with SOLANA_VERIFY_VERSION / SOLANA_VERSION in `.github/.env` and surface
  # the change in the PR description for reviewer scrutiny.
  SOLANA_VERIFY_BASE_IMAGE: solanafoundation/solana-verifiable-build@sha256:ec2e20e1f80607150a71e4c72adfe64be24347ed0b4fb741c32b34eaf7549a25

jobs:
  build_programs:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Load environment variables
        id: env_vars
        run: |
          cat .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              SOLANA_VERSION) printf 'solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ inputs.rust || steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ inputs.solana || steps.env_vars.outputs.solana_version }}
          cache: ${{ env.CACHE }}

      - name: Cache program dependencies
        if: env.CACHE == 'true'
        uses: metaplex-foundation/actions/cache-programs@v1

      - name: Install libudev (required by solana-verify)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Solana Verify
        run: cargo install solana-verify --locked --force --version "${SOLANA_VERIFY_VERSION}"

      - name: Build programs
        shell: bash
        working-directory: configs/scripts/program
        run: ./build.sh
        env:
          PROGRAMS: ${{ env.PROGRAMS }}

      - name: Upload program builds
        uses: actions/upload-artifact@v4
        with:
          name: program-builds
          # First wildcard ensures exported paths are consistently under the programs folder.
          path: ./program*/.bin/*.so
          include-hidden-files: true
          if-no-files-found: error
