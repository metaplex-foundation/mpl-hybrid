name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit hash, branch, or tag to deploy
        required: true
        type: string
        default: main
      program:
        description: Program
        required: true
        default: hybrid
        type: choice
        options:
          - hybrid
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
      version_program:
        description: Version program
        required: true
        default: false
        type: boolean
      level:
        description: Level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

env:
  CACHE: true

jobs:
  build_programs:
    name: Programs
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit
    with:
      git_ref: ${{ inputs.git_ref }}

  test_programs:
    name: Programs
    uses: ./.github/workflows/test-programs.yml
    secrets: inherit
    needs: build_programs
    with:
      program_matrix: '["mpl-${{ inputs.program }}"]'
      git_ref: ${{ inputs.git_ref }}

  test_js:
    name: JS client
    needs: build_programs
    uses: ./.github/workflows/test-js-client.yml
    secrets: inherit
    with:
      git_ref: ${{ inputs.git_ref }}

  test_rust:
    name: Rust client
    needs: build_programs
    uses: ./.github/workflows/test-rust-client.yml
    secrets: inherit
    with:
      git_ref: ${{ inputs.git_ref }}

  deploy_program:
    name: Program / Deploy
    runs-on: ubuntu-latest-16-cores
    needs: [build_programs, test_programs, test_js, test_rust]
    if: |
      always()
      && needs.build_programs.result == 'success'
      && needs.test_programs.result == 'success'
      && needs.test_js.result == 'success'
      && needs.test_rust.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SVC_TOKEN }}
          ref: ${{ inputs.git_ref }}

      - name: Validate branch ref for versioned deploys
        if: github.event.inputs.version_program == 'true' && github.event.inputs.dry_run == 'false' && github.event.inputs.cluster == 'mainnet-beta'
        run: |
          if ! git symbolic-ref -q HEAD >/dev/null; then
            echo "::error::version_program requires git_ref to resolve to a branch, not a tag or commit SHA."
            exit 1
          fi

      - name: Load environment variables
        id: env_vars
        run: |
          grep -E '^(RUST_VERSION|SOLANA_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION|COMMIT_USER_NAME|COMMIT_USER_EMAIL)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      - name: Install solana-verify
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta'
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Install cargo-release
        uses: metaplex-foundation/actions/install-cargo-release@v1
        if: github.event.inputs.version_program == 'true' && github.event.inputs.dry_run == 'false'
        with:
          cache: ${{ env.CACHE }}

      - name: Set RPC
        run: |
          if [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.DEVNET_RPC }}" >> "$GITHUB_ENV"
          else
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          fi

      - name: Determine program version
        id: version
        if: github.event.inputs.version_program == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          IDL_NAME="mpl_${{ inputs.program }}"
          VERSION=`jq '.version' ./idls/${IDL_NAME}.json | sed 's/"//g'`
          MAJOR=`echo ${VERSION} | cut -d. -f1`
          MINOR=`echo ${VERSION} | cut -d. -f2`
          PATCH=`echo ${VERSION} | cut -d. -f3`

          if [ "${{ inputs.level }}" == "major" ]; then
             MAJOR=$((MAJOR + 1))
             MINOR=0
             PATCH=0
          elif [ "${{ inputs.level }}" == "minor" ]; then
             MINOR=$((MINOR + 1))
             PATCH=0
          else
             PATCH=$((PATCH + 1))
          fi

          PROGRAM_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          cp ./idls/${IDL_NAME}.json ./idls/${IDL_NAME}-previous.json
          jq ".version = \"${PROGRAM_VERSION}\"" ./idls/${IDL_NAME}-previous.json > ./idls/${IDL_NAME}.json
          rm ./idls/${IDL_NAME}-previous.json

          printf 'PROGRAM_VERSION=%s\n' "${PROGRAM_VERSION}" >> "$GITHUB_ENV"
          printf 'program_version=%s\n' "${PROGRAM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download program builds
        uses: actions/download-artifact@v4
        with:
          name: program-builds

      - name: Identify Program
        run: |
          printf 'PROGRAM_NAME=%s\n' "mpl_${{ inputs.program }}" >> "$GITHUB_ENV"
          printf 'PROGRAM_PACKAGE=%s\n' "mpl-${{ inputs.program }}-program" >> "$GITHUB_ENV"

      - name: Write signer files
        if: github.event.inputs.dry_run == 'false'
        env:
          HYBRID_DEPLOYER_KEY: ${{ secrets.HYBRID_DEPLOYER_KEY }}
          HYBRID_ID: ${{ secrets.HYBRID_ID }}
        run: |
          printf '%s' "$HYBRID_DEPLOYER_KEY" > ./deployer-key.json
          printf '%s' "$HYBRID_ID" > ./program-id.json

      - name: Deploy Program
        if: github.event.inputs.dry_run == 'false'
        run: |
          echo "Deploying ${{ inputs.program }} to ${{ inputs.cluster }}"

          solana -v program deploy "./programs/.bin/${PROGRAM_NAME}.so" \
            -u "${RPC}" \
            --program-id ./program-id.json \
            -k ./deployer-key.json \
            --max-sign-attempts 100 \
            --use-rpc

      - name: Verify program
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta'
        uses: metaplex-foundation/actions/verify-program@v1
        with:
          program-id-keypair: ./program-id.json
          keypair: ./deployer-key.json
          rpc-url: ${{ env.RPC }}
          library-name: ${{ env.PROGRAM_NAME }}
          package: ${{ env.PROGRAM_PACKAGE }}
          solana-version: ${{ env.SOLANA_VERSION }}

      - name: Version program
        working-directory: ./programs/mpl-${{ inputs.program }}/program
        if: github.event.inputs.version_program == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          git stash
          git config user.name "${COMMIT_USER_NAME}"
          git config user.email "${COMMIT_USER_EMAIL}"

          cargo login ${{ secrets.CRATES_TOKEN }}
          cargo release "${PROGRAM_VERSION}" --no-confirm --no-push --no-tag --no-publish --execute

          git reset --soft HEAD~1
          git stash pop

      - name: Commit and tag new version
        uses: stefanzweifel/git-auto-commit-action@v4
        if: github.event.inputs.version_program == 'true' && github.event.inputs.cluster == 'mainnet-beta' && github.event.inputs.dry_run == 'false'
        with:
          commit_message: Deploy mpl-${{ inputs.program }} program v${{ steps.version.outputs.program_version }}
          tagging_message: mpl-${{ inputs.program }}@v${{ steps.version.outputs.program_version }}

      - name: Clean up signer files
        if: always()
        run: rm -f ./deployer-key.json ./program-id.json
