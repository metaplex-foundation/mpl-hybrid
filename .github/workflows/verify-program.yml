name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag, commit hash, or branch that was deployed
        required: true
        type: string
      program:
        description: Program
        required: true
        default: mpl-hybrid
        type: choice
        options: [mpl-hybrid]
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options: [mainnet-beta]

permissions: {}

jobs:
  verify:
    name: Program
    uses: metaplex-foundation/actions/.github/workflows/verify-program.yml@d23217f66ec0f17ef88cc9e85f2ee093076ac869 # v2.1.0
    permissions:
      contents: read
    secrets:
      RPC_URL: ${{ secrets.MAINNET_RPC }}
      PROGRAM_ID_KEYPAIR: ${{ secrets.HYBRID_ID }}
      DEPLOYER_KEYPAIR: >-
        ${{ inputs.cluster == 'devnet' && secrets.HYBRID_DEPLOYER_KEY
         || inputs.cluster == 'mainnet-beta' && secrets.HYBRID_DEPLOYER_KEY
         || '' }}
    with:
      program: ${{ inputs.program }}
      cluster: ${{ inputs.cluster }}
      git_ref: ${{ inputs.git_ref }}
      runner: ubuntu-latest-16-cores
